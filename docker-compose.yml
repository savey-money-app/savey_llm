version: '3.8'

networks:
  savey_network:
    external: true
    name: savey_api_shared

services:
  redis:
    image: redis:7-alpine
    container_name: savey_llm_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - savey_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  savey_llm:
    platform: linux/amd64
    build: .
    container_name: savey_llm_worker
    restart: always
    volumes:
      - .:/app
    networks:
      - savey_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  redis_data:
